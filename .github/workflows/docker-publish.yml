# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
  # Schedule daily at 12am
  schedule:
    - cron: '0 0 * * *'
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Upstream also pushes to hiob/wishthis on Docker Hub — this fork has no
      # DOCKER_USERNAME/DOCKER_PASSWORD secrets and doesn't own that namespace,
      # so only ghcr.io/<this repo> is published here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: STABLE - Build and push Docker images
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
           ghcr.io/${{ github.repository }}:stable
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WISHTHIS_GITBRANCH=stable

      - name: DEVELOP - Build and push Docker images
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
           ghcr.io/${{ github.repository }}:develop
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WISHTHIS_GITBRANCH=develop

      - name: RELEASE-CANDIDATE - Build and push Docker images
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
           ghcr.io/${{ github.repository }}:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WISHTHIS_GITBRANCH=release-candidate

